# jotiglobe - static site published with Tailscale Funnel. Only tailscaled (same container) talks to this,
# so it listens on localhost only. Installed to /etc/nginx/sites-available/jotiglobe by setup.sh.
# no IP, user agent or referrer
log_format jotiglobe_anon escape=json
	'{"time":"$time_iso8601","method":"$request_method","path":"$uri","page":"$arg_p","entry":"$arg_e",'
	'"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';

server {
	listen 127.0.0.1:8080 default_server;
	server_name _;
	root /srv/jotiglobe;
	index index.html;

	access_log /var/log/nginx/jotiglobe-stats.log jotiglobe_anon;
	error_log /var/log/nginx/jotiglobe-error.log crit;

	server_tokens off;
	charset utf-8;
	gzip on;
	gzip_types application/json text/css application/javascript image/svg+xml;

	# Enforce what the privacy notice says: only same-origin files, no third-party scripts/fonts/analytics.
	# (Also blocks anything a CDN might try to inject.) Geolocation only for this page itself.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), interest-cohort=()" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;

	# Extra locations that live only on the server (not in this repo)
	include /etc/nginx/jotiglobe.d/*.conf;

	location = /hit {
		add_header Cache-Control "no-store" always;
		return 204;
	}
	location = /nginx_status {
		stub_status;
		allow 127.0.0.1;
		deny all;
		access_log off;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}
	location /flags/ {
		add_header Cache-Control "public, max-age=604800";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}
	location /data/ {
		add_header Cache-Control "public, max-age=3600";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}
	location / {
		add_header Cache-Control "no-cache";
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
		add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), interest-cohort=()" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri /index.html;
	}
}
