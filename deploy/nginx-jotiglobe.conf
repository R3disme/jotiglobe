# jotiglobe - static site published with Tailscale Funnel. Only tailscaled (same container) talks to this,
# so it listens on localhost only. Installed to /etc/nginx/sites-available/jotiglobe by setup.sh.
# no IP, user agent or referrer
log_format jotiglobe_anon escape=json
	'{"time":"$time_iso8601","method":"$request_method","path":"$uri","page":"$arg_p","entry":"$arg_e",'
	'"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';

server {
	listen 127.0.0.1:8080 default_server;
	server_name _;
	root /srv/jotiglobe;
	index index.html;

	access_log /var/log/nginx/jotiglobe-stats.log jotiglobe_anon;
	error_log /var/log/nginx/jotiglobe-error.log crit;

	server_tokens off;
	charset utf-8;
	# the build ships .br and .gz next to every text file (vite.config.ts)
	brotli_static on;
	gzip_static on;
	gzip on;
	gzip_types application/json text/css application/javascript image/svg+xml;

	# Enforce what the privacy notice says: only same-origin files, no third-party scripts/fonts/analytics.
	# (Also blocks anything a CDN might try to inject.) Geolocation only for this page itself.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), interest-cohort=()" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;

	error_page 400 401 403 404 405 408 410 429 500 502 503 504 /_errors/$status.html;

	# Extra locations that live only on the server (not in this repo)
	include /etc/nginx/jotiglobe.d/*.conf;

	location = /hit {
		add_header Cache-Control "no-store" always;
		return 204;
	}
	location = /nginx_status {
		stub_status;
		allow 127.0.0.1;
		deny all;
		access_log off;
	}

	location ^~ /_errors/ {
		internal;
		add_header Cache-Control "no-store" always;
		add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
		add_header X-Content-Type-Options "nosniff" always;
	}
	location = /errors/400 { return 400; }
	location = /errors/401 { return 401; }
	location = /errors/403 { return 403; }
	location = /errors/404 { return 404; }
	location = /errors/405 { return 405; }
	location = /errors/408 { return 408; }
	location = /errors/410 { return 410; }
	location = /errors/429 { return 429; }
	location = /errors/500 { return 500; }
	location = /errors/502 { return 502; }
	location = /errors/503 { return 503; }
	location = /errors/504 { return 504; }

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}
	location /flags/ {
		add_header Cache-Control "public, max-age=604800";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}
	location /data/ {
		add_header Cache-Control "public, max-age=3600";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}
	# the app's own pages (keep in step with appRoute in src/lib/router.svelte.ts)
	location ~ ^/(?:stats|groups/[^/]+|countries/[A-Za-z]{2})?/?$ {
		add_header Cache-Control "no-cache";
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
		add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), interest-cohort=()" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Content-Type-Options "nosniff" always;
		try_files /index.html =404;
	}
	location / {
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}
}
